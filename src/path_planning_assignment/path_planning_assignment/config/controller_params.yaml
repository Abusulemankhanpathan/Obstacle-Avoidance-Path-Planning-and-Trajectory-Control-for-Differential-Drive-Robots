# Controller Parameters Configuration
# Save this as: path_planning_assignment/config/controller_params.yaml

trajectory_follower:
  ros__parameters:
    # Pure Pursuit Parameters
    lookahead_distance: 0.1
    max_linear_vel: 0.15
    max_angular_vel: 1.5
    kp_ang: 2.0
    goal_tolerance: 0.15
    waypoint_tolerance: 0.1
    
    # Advanced Controller Parameters (if using advanced controller)
    use_advanced_controller: false  # Set to true to use advanced controller
    advanced_lookahead: 0.6
    advanced_v_max: 0.22
    advanced_kp: 1.8
    advanced_ki: 0.0
    advanced_kd: 0.04
    advanced_max_w: 1.2
    advanced_alpha: 0.45
    advanced_max_dv_per_sec: 0.6
    
    # Path Smoothing Parameters
    smoothness: 0.35
    num_smooth_points: 400
    
    # Waypoints - Rectangle trajectory
    waypoints:
      - [-2.0, -0.5]
      - [-1.5, -0.5]
      - [-1.0, -0.45]
      - [-0.5, -0.48]
      - [0.0, -0.5]
      - [0.5, -0.5]
      - [1.0, -0.45]
      - [1.5, -0.48]
      - [2.0, -0.5]
      - [1.5, 0.0]
      - [2.0, 0.5]
      - [1.0, 0.5]
      - [0.0, 0.5]
      - [-0.5, 0.48]
      - [-1.0, 0.45]
      - [-1.5, 0.5]
      - [-2.0, 0.5]
      - [-2.0, 0.0]
      - [-2.0, -0.5]

path_visualizer:
  ros__parameters:
    # Visualization Parameters
    trail_min_distance: 0.02
    planned_path_width: 0.07
    actual_path_width: 0.15
    waypoint_radius: 0.08
